# The main pipeline for campaign activation

resources:
  pipelines:
    campaign_activation_etl:
      name: campaign_activation_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/campaign_activation_etl"

      libraries:
        - glob:
            include: ../src/campaign_activation_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
