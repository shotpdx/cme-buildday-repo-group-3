resources:
  apps:
    creative_command_center:
      name: ${var.app_name}
      description: Creative Command Center demo with a Databricks SQL pipeline backend, CSV fallback, and React frontend.
      source_code_path: ..
      resources:
        - name: creative-workflow-genie-space
          description: Curated Genie Space used by Ask AI for creative workflow analytics.
          genie_space:
            name: creative-workflow-genie-space
            space_id: ${var.creative_workflow_genie_space_id}
            permission: CAN_RUN
        - name: creative-workflow-sql-wh
          description: SQL warehouse used by the app backend and Genie queries.
          sql_warehouse:
            id: ${var.creative_workflow_sql_warehouse_id}
            permission: CAN_USE
        - name: lakebase-state
          description: Lakebase database used to persist generated variants, approvals, activations, and app state changes.
          database:
            instance_name: ${var.lakebase_instance_name}
            database_name: creative_command_center_state
            permission: CAN_CONNECT_AND_CREATE
        - name: lf-creative-assets-vol
          description: UC volume that stores creative source images and generated variant thumbnails.
          uc_securable:
            securable_type: VOLUME
            securable_full_name: cme_outcomes_uswest.lakefoundry.artifacts
            permission: READ_VOLUME
        - name: lakefoundry-activation-export
          uc_securable:
            securable_type: TABLE
            securable_full_name: cme_outcomes_uswest.lakefoundry.gold_buyside_activation_export
            permission: SELECT
        - name: lf-asset-rights-profile
          uc_securable:
            securable_type: TABLE
            securable_full_name: cme_outcomes_uswest.lakefoundry.gold_buyside_asset_rights_profile
