# Databricks Asset Bundle for the self-contained Creative Command Center app.
# The default deployment only creates the Databricks App and does not require
# any workspace-specific catalogs, schemas, SQL warehouses, or source tables.
bundle:
  name: creative-command-center
  uuid: 82d5ee1f-d361-41a7-821f-ea8c9af061c5

include:
  - resources/creative_command_center.app.yml

variables:
  app_name:
    description: Databricks App name. Override if this name already exists in the target workspace.
    default: creative-command-center-dev

targets:
  dev:
    default: true
    variables:
      app_name: creative-command-center-dev
  prod:
    mode: production
    variables:
      app_name: creative-command-center
