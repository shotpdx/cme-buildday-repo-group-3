# This is a Databricks asset bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_project
  uuid: 82d5ee1f-d361-41a7-821f-ea8c9af061c5

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-2fe34280-c47a.cloud.databricks.com
    variables:
      catalog: cme_outcomes_uswest
      schema: lakefoundry
  prod:
    mode: production
    workspace:
      host: https://dbc-2fe34280-c47a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/cameron.shotwell@slalom.com to make sure we only have a single copy.
      root_path: /Workspace/Users/cameron.shotwell@slalom.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cme_outcomes_uswest
      schema: lakefoundry
    permissions:
      - user_name: cameron.shotwell@slalom.com
        level: CAN_MANAGE
