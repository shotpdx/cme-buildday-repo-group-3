# Databricks Asset Bundle for the Creative Command Center app.
# The dev deployment points the backend at the verified UC tables in
# fs_dev_gold.creative_command_center through a Databricks SQL warehouse.
bundle:
  name: creative-command-center
  uuid: 82d5ee1f-d361-41a7-821f-ea8c9af061c5

include:
  - resources/creative_command_center.app.yml

variables:
  app_name:
    description: Databricks App name. Override if this name already exists in the target workspace.
    default: creative-command-center-dev
  creative_workflow_genie_space_id:
    description: Genie Space ID used by Ask AI for the Creative Command Center workflow.
    default: 01f15b4630bf18b483ee25bb3e20bd3d
  creative_workflow_sql_warehouse_id:
    description: SQL warehouse used by the app and Genie Space.
    default: d24059778e957e41

targets:
  dev:
    default: true
    variables:
      app_name: creative-command-center-dev
      creative_workflow_genie_space_id: 01f15b4630bf18b483ee25bb3e20bd3d
      creative_workflow_sql_warehouse_id: d24059778e957e41
  prod:
    mode: production
    variables:
      app_name: creative-command-center
      creative_workflow_genie_space_id: 01f15b4630bf18b483ee25bb3e20bd3d
      creative_workflow_sql_warehouse_id: d24059778e957e41
