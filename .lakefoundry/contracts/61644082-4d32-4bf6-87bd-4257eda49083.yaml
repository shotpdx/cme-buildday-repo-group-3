id: 61644082-4d32-4bf6-87bd-4257eda49083
title: Creative Generation Workflow Enhancements
work_type: FEATURE_CHANGE
version: 0.1.0
outcome: The goal is to enhance the creative generation workflow within the existing
  Databricks App. The enhanced primary workflow should cover Brief Intake, Audience
  Segments, Creative Search and Retrieval, Creative Generation, Creative Modification
  and Adaptation, Lineage, Governance, and Reuse, Policy, Rights, and Safety Checks,
  Synthetic Audience Evaluation, Selection and Activation, and Continuous Improvement.
  The deployed Databricks App should demonstrate this revised workflow, with generated
  image assets stored as actual files in Unity Catalog volumes. Every generated/adapted
  asset must have lineage, policy checks, and synthetic evaluation records. The app
  should read Databricks tables by default in deployed mode, with CSV fallback for
  local smoke tests. Bundle deployment and run commands must be documented and repeatable.
artifact_plan: "This enhancement will leverage several Databricks skills including\
  \ `databricks-app-python`, `databricks-bundles`, `databricks-spark-declarative-pipelines`,\
  \ `databricks-synthetic-data-gen`, `databricks-unity-catalog`, `databricks-vector-search`,\
  \ `databricks-model-serving`, `databricks-ai-functions`, and `databricks-jobs`.\
  \ \n\n**UX Changes:**\n- Navigation will be updated from `Overview -> Briefs ->\
  \ Audiences -> Creatives -> Markets -> Activations -> Ask AI` to `Overview -> Briefs\
  \ -> Audiences -> Creative Studio -> Evaluation -> Activations -> Ask AI`.\n- `Creative\
  \ Studio` will replace the current Creatives view and include search, generation,\
  \ variants, and adaptation.\n- `Evaluation` will be a new view for policy checks,\
  \ rights checks, synthetic scoring, and ranking.\n- `Markets` will move to a secondary\
  \ insights dashboard.\n- `Ask AI` will remain available as a side panel or final\
  \ tab, backed by governed tables.\n\n**Data Architecture:**\nAll tables will be\
  \ deployed to `${var.catalog}.${var.schema}`. \n\n**Unity Catalog Volumes:**\n-\
  \ A managed UC volume `creative_assets` will be created at `/Volumes/${var.catalog}/${var.schema}/creative_assets/`.\n\
  - Recommended folders: `base/`, `generated/`, `adapted/`, `thumbnails/`, `eval_artifacts/`,\
  \ `exports/`.\n\n**Delta Tables:**\nNew Delta tables will be created: `gold_buyside_audience_trait_profile`,\
  \ `gold_buyside_base_creative_asset`, `gold_buyside_asset_rights_profile`, `gold_buyside_asset_search_corpus`,\
  \ `gold_buyside_creative_generation_request`, `gold_buyside_creative_variant`, `gold_buyside_creative_transformation`,\
  \ `gold_buyside_creative_lineage_edge`, `gold_buyside_creative_policy_check`, `gold_buyside_synthetic_audience_panel`,\
  \ `gold_buyside_synthetic_audience_eval`, `gold_buyside_activation_export`, `gold_buyside_prediction_feedback`.\n\
  \n**Vector Search and Retrieval:**\n- A Databricks Vector Search endpoint `creative-asset-search-${bundle.target}`\
  \ will be created.\n- A Delta Sync index `${var.catalog}.${var.schema}.creative_asset_search_index`\
  \ will be created over `gold_buyside_asset_search_corpus`.\n\n**AI and Model Serving:**\n\
  - Environment variables will be used for `CREATIVE_GENERATION_MODE`, `CREATIVE_GENERATION_ENDPOINT`,\
  \ `CREATIVE_EDITING_ENDPOINT`, `SYNTHETIC_AUDIENCE_JUDGE_ENDPOINT`, `VISION_METADATA_ENDPOINT`,\
  \ `EMBEDDING_ENDPOINT`.\n- Databricks Foundation Model APIs or Model Serving endpoints\
  \ will be used for captioning, policy/brand checks, synthetic audience judging,\
  \ and prompt refinement.\n- Databricks AI Functions will be used for `ai_extract`,\
  \ `ai_classify`, `ai_similarity`, and `ai_query`.\n\n**API Enhancements:**\nNew\
  \ FastAPI endpoints will be added under `my_project/app/main.py` for audience traits,\
  \ creative asset search, generation requests, variants, lineage, policy checks,\
  \ synthetic evaluations, activation exports, and feedback.\n\n**Databricks App Configuration:**\n\
  `my_project/app.yaml` will be updated to use Databricks App resources for `DATABRICKS_WAREHOUSE_ID`,\
  \ `CREATIVE_ASSET_VOLUME`, `CREATIVE_VECTOR_INDEX`, `CREATIVE_GENERATION_ENDPOINT`,\
  \ `SYNTHETIC_AUDIENCE_JUDGE_ENDPOINT`.\n\n**Bundle and Deployment Plan:**\n- Root\
  \ Data Bundle will include new resources: `resources/creative_assets_volume.yml`,\
  \ `resources/creative_workflow_pipeline.yml`, `resources/creative_generation_jobs.yml`.\n\
  - New pipeline/source files: `pipelines/creative_asset_library.py`, `pipelines/creative_generation_workflow.py`,\
  \ `pipelines/creative_policy_checks.py`, `pipelines/synthetic_audience_evaluation.py`,\
  \ `scripts/generate_synthetic_creative_images.py`, `scripts/setup_vector_search_index.py`.\n\
  - App Bundle will update `my_project/app.yaml` and `my_project/app/main.py`.\n\n\
  **Implementation Phases:**\n- **Phase 1 - Demo-Ready Image Workflow:** Move Markets,\
  \ add Creative Studio and Evaluation views. Create UC volume, synthetic image generation\
  \ job, all new Delta tables, Vector Search endpoint/index setup script. Add API\
  \ endpoints. Render synthetic thumbnails and variants. Deploy via bundles.\n- **Phase\
  \ 2 - Model-Backed Creative Generation and Editing:** Add `CREATIVE_GENERATION_MODE=model_endpoint`.\
  \ Implement serving endpoint or external service adapter. Add inpainting/outpainting/crop-safe-area\
  \ controls. Add reviewer workflow.\n- **Phase 3 - Video Support:** Extend workflow\
  \ to video. Support video metadata, transformations, policy checks, and synthetic\
  \ evaluation.\n- **Phase 4 - Continuous Improvement and Genie:** Create feedback\
  \ ingestion. Compare synthetic scores to actual performance. Generate creative pattern\
  \ summaries. Create or update Genie Space for Ask AI.\n"
decisions:
- A creative generation step will be added between the current Audience lens and Creative
  scoring surfaces.
- Image workflows will be prioritized first; video will be a later phase but share
  the same architecture.
- 'Two creative creation routes will be supported: Search/retrieve governed existing
  assets from a vector store and Generate new assets from audience traits, brief context,
  and text instructions.'
- The user will review several variants (3 to 5) before adapting or activating one.
- Creatives will be adapted for placement formats (homepage hero, app tile, newsletter
  banner, social square, story).
- Lineage will be tracked from brief, audience, base asset, prompt, model, and transformations
  to each final creative.
- Auditability will be prioritized over broad reuse, but successful assets will be
  discoverable.
- Policy, rights, brand, regional, and safety checks will occur before activation
  and appear as scores or blocks.
- Market expansion will move out of the primary workflow and become a supporting dashboard.
- Ask AI / Genie will close the decision loop by answering questions over briefs,
  audiences, variants, scores, policy results, activations, and feedback.
assumptions:
- The current project has a Databricks App with React frontend and FastAPI backend
  in `my_project/`.
- CSV fallback data and Databricks SQL table reads are controlled by `APP_DATA_SOURCE`.
- Current app views include Overview, Briefs, Audiences, Creatives, Markets, Activations,
  Ask AI.
- Pipeline tables exist for audience cohorts, generated creative metadata, campaign
  activation, identity graph, and A/B tests.
- A `gold_buyside_generated_creatives` table exists with metadata fields.
- Databricks tokens, warehouse IDs, model endpoint credentials, or external API keys
  will not be hardcoded.
- Databricks App resources and `valueFrom` will be used for various resource references.
- Unity Catalog tables and volumes will be used for all generated and modified creative
  assets.
- Only synthetic audience personas will be stored; no real PII in evaluation tables.
- Policy version, model version, prompt version, and evidence fields will be included
  for auditability.
- Rights checks must be hard gates, and assets with failed/blocked checks will not
  be eligible for activation export.
open_questions:
- Confirm the Unity Catalog and schema for synthetic image data generation. The repo
  defaults to `cme_outcomes_uswest.lakefoundry`, but generation should not run until
  the target is explicitly approved.
- 'Which creative generation/editing service should be treated as the production integration:
  custom Databricks Model Serving endpoint, Adobe Firefly, Runway, another provider,
  or synthetic-only for the demo?'
- Should the first demo support only images, or should video metadata appear as disabled/coming-soon
  UI controls?
- 'Which downstream system should activation simulate first: AEM, Adobe Target, CMS,
  DAM, or onsite personalization?'
- Should the Ask AI path be implemented through Genie Space first, or remain a lightweight
  API response until the data model stabilizes?
- Are brand guideline rules available as structured data, documents, or only prompt
  text?
