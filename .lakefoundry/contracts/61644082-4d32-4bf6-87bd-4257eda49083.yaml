- name: Video Asset Workflow Extension
  size: large
  context:
  - text: 'Phase 3 - Video Support: Extend workflow to video. Support video metadata,
      transformations, policy checks, and synthetic evaluation.'
    source: artifactPlan
  - text: Image workflows will be prioritized first; video will be a later phase but
      share the same architecture.
    source: decisions
  - text: Should the first demo support only images, or should video metadata appear
      as disabled/coming-soon UI controls?
    source: openQuestions
  phase_id: phase-4
  objective: Extend the creative asset workflow to support video, including metadata
    management, transformations, policy checks, and synthetic evaluation for video
    assets.
  dependencies:
  - phase-3
  phase_number: 4
  delivery_area: data_engineering
  excluded_scope:
  - Continuous improvement features.
  - Ask AI functionality and Genie Space integration.
  included_scope:
  - Extension of the Unity Catalog volume and Delta tables to accommodate video assets,
    including video-specific metadata fields.
  - Development of data ingestion pipelines for video assets, similar to `pipelines/creative_asset_library.py`
    but for video.
  - Implementation of video transformation capabilities (e.g., resizing, format conversion,
    thumbnail generation from video).
  - Integration of ML models for video-specific policy checks, rights checks, and
    synthetic evaluation.
  - Updates to FastAPI endpoints to handle video asset uploads, processing, and retrieval.
  - Updates to the `Creative Studio` and `Evaluation` views to display and interact
    with video assets (e.g., video player, video-specific controls).
  split_rationale: This phase introduces support for a completely new asset type (video),
    requiring significant extensions across data engineering, ML, and the application
    layer. It's a large, distinct feature increment that builds upon the established
    image workflow.
  validation_plan:
  - Upload various video formats and sizes through the app/API and verify their storage
    and metadata in UC.
  - Execute the video processing pipeline and confirm successful transformations and
    thumbnail generation.
  - Submit video assets for policy/evaluation checks and review the results in the
    'Evaluation' view.
  - Test video playback and interaction within the Databricks App UI.
  acceptance_criteria:
  - description: Video assets can be uploaded and stored in the UC volume, and their
      metadata is correctly captured in Delta tables.
    criterion_id: video-assets-stored-correctly
  - description: The video ingestion and transformation pipeline successfully processes
      video files, generates thumbnails, and updates metadata.
    criterion_id: video-pipeline-functional
  - description: Video-specific policy checks and synthetic evaluations run successfully
      and provide accurate results for video assets.
    criterion_id: video-ml-checks-accurate
  - description: Video assets are correctly displayed and playable within the 'Creative
      Studio' and 'Evaluation' views of the Databricks App.
    criterion_id: video-display-in-app
  expected_deliverables:
  - name: Video Asset Data Architecture
    description: UC volume and Delta tables extended to store and manage video assets
      and their metadata.
    deliverable_id: video-asset-data-support
  - name: Video Asset Ingestion and Transformation Pipeline
    description: A data pipeline capable of ingesting video assets, performing transformations,
      and generating video thumbnails.
    deliverable_id: video-ingestion-pipeline
  - name: ML Integration for Video Policy/Evaluation
    description: ML models integrated for video-specific policy checks and synthetic
      evaluation.
    deliverable_id: video-ml-integration
  - name: Databricks App Video Support
    description: UI and API enhancements in 'Creative Studio' and 'Evaluation' views
      to display and manage video assets.
    deliverable_id: video-app-support
- name: Continuous Improvement and Ask AI Integration
  size: medium
  context:
  - text: 'UX Changes: `Ask AI` will remain available as a side panel or final tab,
      backed by governed tables. AI and Model Serving: Databricks AI Functions will
      be used for `ai_extract`, `ai_classify`, `ai_similarity`, and `ai_query`. Phase
      4 - Continuous Improvement and Genie: Create feedback ingestion. Compare synthetic
      scores to actual performance. Generate creative pattern summaries. Create or
      update Genie Space for Ask AI.'
    source: artifactPlan
  - text: Ask AI / Genie will close the decision loop by answering questions over
      briefs, audiences, variants, scores, policy results, activations, and feedback.
    source: decisions
  - text: Should the Ask AI path be implemented through Genie Space first, or remain
      a lightweight API response until the data model stabilizes? Are brand guideline
      rules available as structured data, documents, or only prompt text?
    source: openQuestions
  phase_id: phase-5
  objective: Implement mechanisms for continuous improvement based on feedback and
    performance data, and integrate the Ask AI functionality into the Databricks App,
    potentially via a Genie Space.
  dependencies:
  - phase-4
  phase_number: 5
  delivery_area: analytics_bi
  excluded_scope:
  - Further extensions to new asset types or core creative generation/editing features.
  included_scope:
  - Development of a feedback ingestion pipeline and data model to capture user feedback
    and performance data for creative assets.
  - Implementation of analytics to compare synthetic scores to actual performance,
    identifying discrepancies and insights.
  - Development of functionality to generate creative pattern summaries and insights
    based on performance data.
  - Integration of 'Ask AI' functionality into the Databricks App, either as a side
    panel or a final tab.
  - Development of the 'Ask AI' backend using Databricks AI Functions (`ai_extract`,
    `ai_classify`, `ai_similarity`, `ai_query`) over governed tables.
  - Potential creation or update of a Databricks Genie Space for 'Ask AI' to provide
    a conversational interface.
  split_rationale: This phase focuses on closing the loop for the creative workflow
    by adding feedback mechanisms, performance analytics, and an intelligent 'Ask
    AI' interface. It leverages both data science/ML for insights and BI/App for user
    interaction, making it a distinct final deliverable for continuous improvement.
  validation_plan:
  - Submit sample feedback and performance data and verify its ingestion and storage.
  - Review generated analytics reports and creative pattern summaries for accuracy
    and insights.
  - Test 'Ask AI' with a variety of questions related to the creative workflow data
    and verify the relevance and accuracy of responses.
  - If a Genie Space is implemented, test its conversational capabilities and data
    access.
  - Verify that 'Ask AI' queries are executed against the correct governed tables.
  acceptance_criteria:
  - description: User feedback and performance metrics for creative assets are successfully
      captured and stored in the feedback data model.
    criterion_id: feedback-captured-and-stored
  - description: The system generates meaningful comparisons between synthetic scores
      and actual performance, and provides creative pattern summaries.
    criterion_id: performance-insights-generated
  - description: The 'Ask AI' feature in the Databricks App responds accurately to
      queries about briefs, audiences, variants, scores, policy results, and activations.
    criterion_id: ask-ai-functional-in-app
  - description: The 'Ask AI' functionality correctly queries governed tables and
      utilizes Databricks AI Functions for its responses.
    criterion_id: ask-ai-uses-governed-data
  - description: If implemented, the Databricks Genie Space for 'Ask AI' is accessible
      and provides a functional conversational interface.
    criterion_id: genie-space-functional-if-implemented
  expected_deliverables:
  - name: Creative Feedback Ingestion and Data Model
    description: A system to capture and store user feedback and actual performance
      data for creative assets.
    deliverable_id: feedback-ingestion-system
  - name: Creative Performance Analytics
    description: Analytics and reports comparing synthetic scores to actual performance,
      and identifying creative pattern summaries.
    deliverable_id: performance-analytics-reports
  - name: Ask AI Feature in Databricks App
    description: A functional 'Ask AI' interface integrated into the Databricks App,
      backed by governed data and AI Functions.
    deliverable_id: ask-ai-integration
  - name: Databricks Genie Space for Ask AI (Optional)
    description: A dedicated Databricks Genie Space providing a conversational interface
      for 'Ask AI' queries (if chosen over in-app only).
    deliverable_id: genie-space-for-ask-ai
