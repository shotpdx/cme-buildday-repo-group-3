# Genie Space Configuration for Creative Command Center
#
# This file is intentionally comment-only because the root Databricks bundle
# includes resources/*.yml. The Genie Space itself is created or updated by:
#
#   scripts/setup_creative_genie_space.py
#
# Current deployed space:
#   display_name: Creative Command Center - Creative Workflow
#   space_id: 01f15b4630bf18b483ee25bb3e20bd3d
#   warehouse_id: 8d3ba577483125f2
#
# Purpose:
#   Natural language analytics for the Creative Command Center workflow. The
#   space includes all queryable gold tables in the buyside creative workflow,
#   plus related media-demo gold tables for brief, audience, asset, engagement,
#   affinity, churn, value, and media-plan context.
#
# Core table groups:
#   cme_outcomes_uswest.lakefoundry
#     - gold_buyside_activation_export
#     - gold_buyside_asset_rights_profile
#     - gold_buyside_asset_search_corpus
#     - gold_buyside_audience_cohort
#     - gold_buyside_audience_trait_profile
#     - gold_buyside_base_creative_asset
#     - gold_buyside_campaign_activation
#     - gold_buyside_creative_generation_request
#     - gold_buyside_creative_lineage_edge
#     - gold_buyside_creative_policy_check
#     - gold_buyside_creative_transformation
#     - gold_buyside_creative_variant
#     - gold_buyside_generated_creatives
#     - gold_buyside_prediction_feedback
#     - gold_buyside_synthetic_audience_eval
#     - gold_buyside_synthetic_audience_panel
#
#   cme_outcomes_uswest.media_demo
#     - gold_media_audience_segments
#     - gold_media_brand_asset_library
#     - gold_media_campaign_engagement
#     - gold_media_churn_predictions
#     - gold_media_content_affinity
#     - gold_media_creative_briefs
#     - gold_media_creative_concepts
#     - gold_media_customer_360
#     - gold_media_customer_enrichment
#     - gold_media_customer_ltv
#     - gold_media_media_plan_line_items
#     - gold_media_top_genres_per_user
#
# Relationships for Genie description:
#   - briefs join generation requests and variants through brief_id.
#   - cohorts join trait profiles, requests, variants, panels, evaluations,
#     exports, and feedback through cohort_id.
#   - base assets join rights profiles by rights_profile_id and variants through
#     source_asset_id or selected_base_asset_ids_json.
#   - requests join variants by request_id.
#   - variants join transformations, policy checks, evaluations, exports,
#     campaign activation, lineage, and feedback by creative_asset_id.
#
# Sample questions:
#   - Which approved creative variants rank highest by segment and placement?
#   - Which pending review variants are missing policy checks or synthetic audience evaluations?
#   - Which base creative assets are approved for homepage hero placements for sports audiences?
#   - What transformations were applied to each creative variant?
#   - Which policy checks are blocked, warning, or require review?
#   - Which creatives are ready for onsite personalization activation exports?
#
# Workspace notes:
#   The setup script skipped these otherwise relevant gold tables because the
#   current principal lacks SELECT:
#     - cme_outcomes_uswest.lakefoundry.gold_buyside_ab_test_config
#     - cme_outcomes_uswest.lakefoundry.gold_buyside_ab_test_variant
