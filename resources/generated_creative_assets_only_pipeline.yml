resources:
  pipelines:
    generated_creative_assets_only_pipeline:
      name: "[${bundle.target}] Generated Creative Assets Only Pipeline"
      
      # Target catalog and schema
      catalog: ${var.catalog}
      target: ${var.schema}
      
      # Pipeline libraries - only include generated_creative_assets.py
      libraries:
        - file:
            path: ../pipelines/generated_creative_assets.py
      
      root_path: ../
      
      serverless: true
      
      # Pipeline configuration - pass source catalog/schema for reading existing tables
      configuration:
        source_catalog: ${var.source_catalog}
        source_schema: ${var.source_schema}
      
      continuous: false
      development: true
      photon: true
      
      channel: current
      
      permissions:
        - level: CAN_VIEW
          group_name: "users"
