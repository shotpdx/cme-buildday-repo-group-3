resources:
  pipelines:
    buyside_data_foundation:
      name: "[${bundle.target}] Buyside Data Foundation Pipeline"
      
      # Target catalog and schema
      catalog: ${var.catalog}
      target: ${var.schema}
      
      # Pipeline libraries - only downstream pipelines (csv_to_bronze runs separately)
      libraries:
        - file:
            path: ../pipelines/ab_test_tables.py
        - file:
            path: ../pipelines/audience_cohort_reference.py
        - file:
            path: ../pipelines/campaign_activation.py
        - file:
            path: ../pipelines/generated_creative_assets.py
        - file:
            path: ../pipelines/identity_graph.py
      
      root_path: ../

      serverless: true
      
      # Pipeline configuration - pass source catalog/schema for reading existing tables
      configuration:
        source_catalog: ${var.source_catalog}
        source_schema: ${var.source_schema}
      
      continuous: false
      development: true
      photon: true
      
      channel: current
      
      permissions:
        - level: CAN_VIEW
          group_name: "users"
